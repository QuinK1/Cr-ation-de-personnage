        /* BRUME MOUVANTE SACRÉE (CANVAS VOLUMÉTRIQUE VISIBLE ET ACTIF) */
        #mistCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        /* Voile de lisibilité central doux */
        .ambient-veil {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(247, 247, 249, 0.88) 0%, rgba(244, 244, 248, 0.75) 60%, rgba(230, 230, 238, 0.55) 100%);

            pointer-events: none;
        }

        .holy-fade {
            animation: holyAppear 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes holyAppear {
            0% {
                opacity: 0;
                transform: translateY(14px) scale(0.985);
                filter: blur(4px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        /* Curseur discret d'écriture sacrée */
        .sacred-cursor::after {
            content: '❘';
            display: inline-block;
            margin-left: 2px;
            color: #b8a67c;
            animation: sacredBlink 0.9s infinite;
        }

        @keyframes sacredBlink {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.85; }
        }

        .sacred-input {

        /* ==========================================================================

           ========================================================================== */
        let currentTypewriterTimeouts = [];

        function clearTypewriters() {
            currentTypewriterTimeouts.forEach(t => clearTimeout(t));
            currentTypewriterTimeouts = [];
        }

        function typeWriterEffect(targetElement, fullText, speed = 26, onComplete = null) {
            targetElement.textContent = "";
            targetElement.classList.add("sacred-cursor");
            let charIndex = 0;

            function nextChar() {
                if (charIndex < fullText.length) {
                    targetElement.textContent += fullText.charAt(charIndex);
                    charIndex++;
                    const delay = (fullText.charAt(charIndex - 1) === '.' || fullText.charAt(charIndex - 1) === '?' || fullText.charAt(charIndex - 1) === ',') ? speed * 3.5 : speed;
                    const timeoutId = setTimeout(nextChar, delay);
                    currentTypewriterTimeouts.push(timeoutId);
                } else {
                    targetElement.classList.remove("sacred-cursor");
                    if (onComplete) onComplete();
                }
            }
            nextChar();
        }

        function revealAfterTyping(selector) {
            const el = document.querySelector(selector);
            if (el) {
                el.classList.remove("opacity-0", "pointer-events-none");
                el.classList.add("holy-fade");
            }
        }

            character.weight = (!isNaN(val) && val > 0) ? val : 70;

            // Calcul silencieux de l'IMC pour le calibrage

            character.bmi = parseFloat((character.weight / (hm * hm)).toFixed(1));

            if (character.bmi < 18.5) character.bmiCategory = "Maigreur";
            else if (character.bmi <= 24.9) character.bmiCategory = "Normale";
            else if (character.bmi <= 29.9) character.bmiCategory = "Surpoids";
            else character.bmiCategory = "Corpulence";

            // Préparation des stats automatiques selon Âge & morphologie
            applySecretBmiAndAgeSuggestion();

            let weightComment = `${character.weight} kg de chair et de sang.`;
            if (character.weight >= 130) {
                weightComment = `${character.weight} kg d'une masse imposante qui fera trembler les planchers.`;

        /* 6. Aspiration de Vie & Statistiques (Base 0, 4 bonus & 2 malus) */
        function applySecretBmiAndAgeSuggestion() {
            character.stats = { force: 0, esprit: 0, agilite: 0, perception: 0, charisme: 0 };
            const age = character.age;
            const bmi = character.bmi;

            if (age >= 55) {
                character.stats.esprit = 3;
                character.stats.perception = 1;
                character.stats.agilite = -1;
                character.stats.force = -1;
            } else if (age >= 40) {
                if (bmi >= 25) {
                    character.stats.esprit = 2;
                    character.stats.force = 2;
                    character.stats.agilite = -2;
                } else {
                    character.stats.esprit = 2;
                    character.stats.perception = 2;
                    character.stats.agilite = -1;
                    character.stats.force = -1;
                }
            } else if (age < 20) {
                if (bmi < 20) {
                    character.stats.agilite = 2;
                    character.stats.perception = 2;
                    character.stats.esprit = -1;
                    character.stats.force = -1;
                } else {
                    character.stats.agilite = 2;
                    character.stats.force = 2;
                    character.stats.esprit = -2;
                }
            } else {
                if (bmi >= 27) {
                    character.stats.force = 3;
                    character.stats.esprit = 1;
                    character.stats.agilite = -2;
                } else if (bmi < 19) {
                    character.stats.agilite = 2;
                    character.stats.perception = 2;
                    character.stats.force = -2;
                } else {
                    character.stats.force = 1;
                    character.stats.esprit = 1;
                    character.stats.agilite = 1;
                    character.stats.perception = 1;
                    character.stats.charisme = -2;
                }
            }
        }

        function getStatsBudget() {
            let pos = 0, neg = 0;
            for (const val of Object.values(character.stats)) {
                if (val > 0) pos += val;
                if (val < 0) neg += Math.abs(val);
            }
            return {
                bonusUsed: pos,
                malusUsed: neg,
                isValid: (pos === 4 && neg === 2)
            };
        }

        function modifyStatInEditor(key, delta) {
            const current = character.stats[key];
            const next = current + delta;
            if (next < -2 || next > 3) return;

            const budget = getStatsBudget();

            if (delta > 0) {
                if (current < 0) character.stats[key] = next;
                else if (budget.bonusUsed < 4) character.stats[key] = next;
            } else if (delta < 0) {
                if (current > 0) character.stats[key] = next;
                else if (budget.malusUsed < 2) character.stats[key] = next;
            }

            renderStatsEditorContent();
        }

        function normalizeText(str) {
            return str
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9\s]/g, " ");
        }

        function analyzeGiftKeywords(title, description) {
            const rawText = `${title} ${description}`;
            const normalized = normalizeText(rawText);
            const tokens = normalized.split(/\s+/).filter(Boolean);

            const scores = {};
            for (const key of Object.keys(APOSTLE_GIFTS)) scores[key] = 0;

            for (const [apostleKey, keywords] of Object.entries(APOSTLE_KEYWORDS)) {
                for (const kw of keywords) {
                    const normKw = normalizeText(kw);
                    for (const token of tokens) {
                        if (token === normKw) scores[apostleKey] += 3;
                        else if (token.length >= 4 && (token.startsWith(normKw) || normKw.startsWith(token))) scores[apostleKey] += 1;
                    }
                }
            }

            let maxScore = 0;
            let best = [];
            for (const [key, sc] of Object.entries(scores)) {
                if (sc > maxScore) { maxScore = sc; best = [key]; }
                else if (sc === maxScore && sc > 0) { best.push(key); }
            }

            if (maxScore === 0) return { tied: false, apostles: ["ian"] };
            if (best.length >= 2) return { tied: true, apostles: best };
            return { tied: false, apostles: best };
        }

        function submitManualGift() {
            character.caste = document.getElementById('manualCaste').value;
            character.giftName = document.getElementById('manualGiftTitle').value.trim() || "Don Singulier";
            character.giftDesc = document.getElementById('manualGiftDescription').value.trim() || "Pouvoir éveillé selon la coutume.";

            const analysis = analyzeGiftKeywords(character.giftName, character.giftDesc);

            if (analysis.tied && analysis.apostles.length >= 2) {
                triggerCaipheDislocation(analysis.apostles[0], analysis.apostles[1]);
            } else {
                const apostleKey = analysis.apostles[0] || "ian";
                const profile = APOSTLE_GIFTS[apostleKey] || APOSTLE_GIFTS.ian;
                character.lineage = profile.lineage;
                character.affinity = `Révélation divine : Résonance avec ${profile.apostle} (Fondement : ${profile.foundation})`;
                finishCreation();
            }
        }

        /* 9. Le Test des 13 Questions sans retour */
        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function startRitual13Questions() {
            apostleAffinityScores = {
                zohar: 0, amon: 0, simon: 0, ovid: 0,
                ian: 0, jacob: 0, jediah: 0, shiloh: 0,
                ioseph: 0, sinai: 0, eben: 0, tovi: 0
            };
            ritualStepIndex = 0;
            showRitualQuestion();
        }

        function showRitualQuestion() {
            const q = RITUAL_QUESTIONS[ritualStepIndex];
            const shuffledAnswers = shuffleArray(q.answers);

            let answersHtml = shuffledAnswers.map((ans, idx) => `
                <div onclick="answerRitualQuestion('${ans.apostle}')" class="cursor-pointer p-4 rounded-xl border border-sanctuary-300 hover:border-sanctuary-800 bg-white/70 hover:bg-white transition text-xs font-garamond text-sanctuary-900 leading-relaxed text-left group">
                    <span class="inline-block w-5 text-softGold font-cinzel">${String.fromCharCode(65 + idx)}.</span>
                    <span>${ans.text}</span>
                </div>
            `).join('');

            renderScene(`
                <span class="text-[11px] font-cinzel text-softGold uppercase tracking-widest block">Épreuve ${ritualStepIndex + 1} sur 13</span>
                <p id="voiceSpeech" class="text-xl sm:text-2xl font-garamond italic text-sanctuary-900 leading-relaxed max-w-xl mx-auto min-h-[4rem]"></p>
                <div id="answersContainer" class="space-y-2.5 max-w-xl mx-auto pt-4 opacity-0 pointer-events-none transition">
                    ${answersHtml}

            `);
            typeWriterEffect(
                document.getElementById('voiceSpeech'),
                `« ${q.text} »`,
                22,
                () => revealAfterTyping('#answersContainer')
            );
        }

        function answerRitualQuestion(apostleKey) {
            if (apostleAffinityScores[apostleKey] !== undefined) {
                apostleAffinityScores[apostleKey] += 1;
            }

            ritualStepIndex++;
            if (ritualStepIndex < RITUAL_QUESTIONS.length) {
                showRitualQuestion();
            } else {
                evaluateRitualOutcome();
            }
        }

        function evaluateRitualOutcome() {
            let maxScore = -1;
            let topApostles = [];

            for (const [key, sc] of Object.entries(apostleAffinityScores)) {
                if (sc > maxScore) { maxScore = sc; topApostles = [key]; }
                else if (sc === maxScore && sc > 0) { topApostles.push(key); }
            }

            // Égalité à 3 ou plus : Intervention de Caïphe pour la question impossible de la perte
            if (topApostles.length >= 3) {
                triggerCaipheDilemmaOfLoss(topApostles);
            } 
            // Égalité stricte à 2 : Déroulement canonique de l'anomalie
            else if (topApostles.length === 2) {
                triggerCaipheDislocation(topApostles[0], topApostles[1]);
            } 
            // Un seul apôtre dominant
            else {
                const dominant = topApostles[0] || "simon";
                const giftProfile = APOSTLE_GIFTS[dominant] || APOSTLE_GIFTS.simon;

                character.isDislocated = false;
                character.caste = giftProfile.caste;
                character.lineage = giftProfile.lineage;
                character.giftName = giftProfile.giftName;
                character.giftDesc = giftProfile.giftDesc;
                character.affinity = `Écho de ${giftProfile.apostle} (Fondement : ${giftProfile.foundation})`;
                finishCreation();
            }
        }

        function resolveTieLoss(eliminatedApostle, tiedApostles) {
            // L'apôtre dont la perte est assumée ou écartée permet d'obtenir strictement 2 apôtres restants
            const remainingTwo = tiedApostles.filter(k => k !== eliminatedApostle).slice(0, 2);

                    </p>
                </div>

                <!-- FICHE DE NAISSANCE -->
                <div id="sheetContainer" class="p-6 sm:p-8 rounded-2xl border border-sanctuary-300 bg-white/90 print-clean text-left space-y-6 max-w-xl mx-auto shadow-sm opacity-0 pointer-events-none transition">
                    <div class="flex flex-wrap items-baseline justify-between border-b border-sanctuary-200 pb-3 gap-2">
                        <div>
                            <span class="text-[10px] font-cinzel tracking-widest uppercase text-sanctuary-400 block">Fiche d'Éveil Terrestre</span>
                            <h3 class="text-2xl font-cinzel font-bold text-sanctuary-900">${character.firstName} ${character.lastName}</h3>
                        </div>
                        <div class="relative group/caste text-right">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-cinzel font-semibold bg-sanctuary-100 border border-sanctuary-300 text-sanctuary-800 cursor-help">
                                Caste : ${character.caste} <i class="fa-solid fa-circle-info text-[10px] text-sanctuary-400"></i>
                            </span>
                            <div class="invisible group-hover/caste:visible opacity-0 group-hover/caste:opacity-100 transition-all duration-200 absolute right-0 top-full mt-2 w-72 p-3 bg-white text-sanctuary-900 rounded-xl border border-sanctuary-300 shadow-xl z-50 text-left pointer-events-none no-print">
                                <span class="font-cinzel font-bold text-xs uppercase block text-sanctuary-900 mb-1">${casteInfo.title}</span>
                                <span class="text-[10px] font-cinzel text-softGold uppercase block mb-1.5">${casteInfo.rank}</span>
                                <p class="text-xs text-sanctuary-600 leading-relaxed italic">${casteInfo.desc}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Données physiques SANS IMC -->
                    <div class="grid grid-cols-4 gap-2 text-xs bg-sanctuary-50/70 p-3 rounded-xl border border-sanctuary-200 text-center">
                        <div>
                            <span class="font-cinzel text-sanctuary-400 block text-[10px] uppercase">Genre</span>
                            <span class="font-semibold text-sanctuary-900">${character.gender}</span>
                        </div>
                        <div>
                            <span class="font-cinzel text-sanctuary-400 block text-[10px] uppercase">Âge</span>
                            <span class="font-semibold text-sanctuary-900">${character.age} ans</span>
                        </div>
                        <div>
                            <span class="font-cinzel text-sanctuary-400 block text-[10px] uppercase">Stature</span>
                            <span class="font-semibold text-sanctuary-900">${character.height} cm</span>
                        </div>
                        <div>
                            <span class="font-cinzel text-sanctuary-400 block text-[10px] uppercase">Poids</span>
                            <span class="font-semibold text-sanctuary-900">${character.weight} kg</span>
                        </div>
                    </div>

                    <!-- Statistiques D100 -->
                    <div>
                        <h4 class="text-xs font-cinzel font-bold text-sanctuary-700 uppercase tracking-wider mb-2">
                            Statistiques & Modificateurs d'Épreuves (1d100)
                        </h4>
                        <div class="grid grid-cols-5 gap-2 text-center text-xs">
                            ${['force', 'esprit', 'agilite', 'perception', 'charisme'].map(k => {
                                const v = character.stats[k];
                                const p = v * 5;
                                const names = { force: 'Force', esprit: 'Esprit', agilite: 'Agilité', perception: 'Perception', charisme: 'Charisme' };
                                return `
                                    <div class="p-2 rounded-lg border border-sanctuary-200 bg-white">
                                        <span class="font-cinzel block text-sanctuary-400 text-[10px] uppercase">${names[k]}</span>
                                        <span class="text-sm font-cinzel font-bold text-sanctuary-900">${v >= 0 ? `+${v}` : v}</span>
                                        <span class="block font-mono text-[10px] ${p > 0 ? 'text-sanctuary-900 font-bold' : (p < 0 ? 'text-red-600 font-bold' : 'text-sanctuary-400')}">${p >= 0 ? `+${p}%` : `${p}%`}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Don & Lignée -->
                    <div class="border-t border-sanctuary-200 pt-4">
                        <div class="p-4 rounded-xl bg-sanctuary-50/70 border border-sanctuary-200 text-xs space-y-1.5">
                            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1">
                                <strong class="font-cinzel text-sm text-sanctuary-900">${character.giftName}</strong>
                                <span class="text-[10px] text-softGold italic font-cinzel">${character.lineage}</span>
                            </div>
                            <span class="text-[11px] text-sanctuary-500 font-cinzel block">${character.affinity}</span>
                            <p class="text-sanctuary-700 italic leading-relaxed pt-1">
                                ${character.giftDesc}
                            </p>
                        </div>
                    </div>
                </div>

                <div id="sheetActions" class="pt-6 flex flex-wrap items-center justify-between gap-4 max-w-xl mx-auto no-print opacity-0 pointer-events-none transition">
                    <button onclick="restartAll()" class="text-xs font-cinzel text-sanctuary-500 hover:text-sanctuary-900 transition">
                        ← Présenter une nouvelle âme
                    </button>
                    <button onclick="window.print()" class="px-5 py-2.5 rounded-xl bg-sanctuary-900 hover:bg-sanctuary-800 text-white font-cinzel text-xs tracking-wider uppercase transition flex items-center gap-2">
                        <i class="fa-solid fa-print"></i> Imprimer la fiche
                    </button>
                </div>
            `);

            typeWriterEffect(
                document.getElementById('voiceSpeech'),
                finalHeading,
                25,
                () => {
                    const sub = document.getElementById('finalSub');
                    if (sub) sub.classList.remove('opacity-0');
                    revealAfterTyping('#sheetContainer');
                    revealAfterTyping('#sheetActions');
                }
            );
        }

        function restartAll() {
            introIdx = 0;
            character.stats = { force: 0, esprit: 0, agilite: 0, perception: 0, charisme: 0 };
            character.isDislocated = false;
            showIntroStep();
        }

        window.onload = function() {
            initMistCanvas();
            showIntroStep();
        };

        /* ==========================================================================
           MOTEUR DE BRUME ATMOSPHÉRIQUE FLUIDE (SIMULATION VISUELLE RÉELLE)
           ========================================================================== */
        function initMistCanvas() {
            const canvas = document.getElementById('mistCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let width, height;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // Création de 12 vortex de brume vaporeuse avec vitesses et rayons variables
            const clouds = [];
            const cloudCount = 10;
            for (let i = 0; i < cloudCount; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.max(width, height) * (0.35 + Math.random() * 0.3),
                    vx: (Math.random() - 0.5) * 0.45,
                    vy: (Math.random() - 0.5) * 0.45,
                    alpha: 0.28 + Math.random() * 0.32,
                    phase: Math.random() * Math.PI * 2,
                    phaseSpeed: 0.008 + Math.random() * 0.012
                });
            }

            function animateMist() {
                // Fond de base cendreux
                ctx.fillStyle = '#e8e8ed';
                ctx.fillRect(0, 0, width, height);

                // Dessin et interpénétration des nappes de brume
                for (let i = 0; i < clouds.length; i++) {
                    const c = clouds[i];
                    c.x += c.vx;
                    c.y += c.vy;
                    c.phase += c.phaseSpeed;

                    // Rebond doux aux marges
                    if (c.x < -c.radius * 0.5) c.vx = Math.abs(c.vx);
                    if (c.x > width + c.radius * 0.5) c.vx = -Math.abs(c.vx);
                    if (c.y < -c.radius * 0.5) c.vy = Math.abs(c.vy);
                    if (c.y > height + c.radius * 0.5) c.vy = -Math.abs(c.vy);

                    const dynamicRadius = c.radius * (1 + 0.12 * Math.sin(c.phase));
                    const dynamicAlpha = c.alpha * (0.75 + 0.25 * Math.cos(c.phase));

                    const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, dynamicRadius);
                    // Brume sombre vaporeuse contrastée identique à l'enregistrement vidéo
                    grad.addColorStop(0, `rgba(45, 48, 58, ${dynamicAlpha})`);
                    grad.addColorStop(0.45, `rgba(110, 114, 128, ${dynamicAlpha * 0.55})`);
                    grad.addColorStop(0.75, `rgba(185, 188, 198, ${dynamicAlpha * 0.2})`);
                    grad.addColorStop(1, 'rgba(235, 235, 240, 0)');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, dynamicRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                requestAnimationFrame(animateMist);
            }

            animateMist();
        }
    </script>
</body>
</html>
